[project]
name = "tiny-mcp-contract"
version = "0.1.0"
description = "Zero-dependency MCP tool-contract snapshots and diffs. Catch silent breaking changes between server releases."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "contract",
    "contract-testing",
    "schema-diff",
    "breaking-changes",
    "ci",
    "zero-dependency",
    "stdlib",
    "developer-tools",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-mcp-contract"
Repository = "https://github.com/hussain-alsaibai/tiny-mcp-contract"
Issues = "https://github.com/hussain-alsaibai/tiny-mcp-contract/issues"

[project.scripts]
tiny-mcp-contract = "tiny_mcp_contract.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiny_mcp_contract"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031", "UP032"]
